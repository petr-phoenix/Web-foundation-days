<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note & Draft Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="heading">
      <h1>Note Editor</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <label for="note-text" class="sr-only">Your Note:</label>
      <textarea id="note-text" placeholder="Type your note here... (Press Escape to clear)"></textarea>

      <div class="stats">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button id="clear-btn" type="button">Clear Note</button>

      </div>
    </main>
  </div>
</body>
</html>
